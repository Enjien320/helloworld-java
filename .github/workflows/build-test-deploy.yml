name: Construction test et deployement

on:
  push:
    branches:
      - main

env:
  PROJECT_VERSION: "1.0.0"

jobs:
  RealisationBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
      - name: Setup du JDK
        uses: actions/setup-java@v5.0.0
        with:
          # The Java version to set up. Takes a whole or semver Java version. See examples of supported syntax in README file
          java-version: 17
          # Java distribution. See the list of supported distributions in README file
          distribution: zulu
      - name: Mise en place cache
        uses: actions/cache@v4.3.0
        with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path: "${{ github.workspace }}/.m2/repository"
          # An explicit key for restoring and saving the cache
          key: "cache"
      - name: Compilation de maven
        run: mvn clean package -DskipTests
        env:
          MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          # Artifact name
          name: "helloword-${{ env.PROJECT_VERSION }}.jar"
          # A file, directory or wildcard pattern that describes what to upload
          path: "target/helloworld-1.0-SNAPSHOT.jar"

  ExecutionTests:
    runs-on: ubuntu-latest
    needs: RealisationBuild
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0
      - name: Setup du JDK
        uses: actions/setup-java@v5.0.0
        with:
          # The Java version to set up. Takes a whole or semver Java version. See examples of supported syntax in README file
          java-version: 17
          # Java distribution. See the list of supported distributions in README file
          distribution: zulu
      - name: Mise en place cache
        uses: actions/cache@v4.3.0
        with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path: "${{ github.workspace }}/.m2/repository"
          # An explicit key for restoring and saving the cache
          key: "cache"
      - name: Tests unitaires de maven
        run: mvn test package
        continue-on-error: true
        env:
          MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"
